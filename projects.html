<!-- segment : detail window, project info with a screenshot slider (filled by js/ultra.js) -->
<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="win">
    <div class="win-bar"><span>Project file</span><button class="x" id="dClose" type="button" aria-label="Close">X</button></div>
    <div class="win-body">
      <h2 id="dName">Project name</h2>
      <p class="tags" id="dTags"></p>
      <div class="shot" id="shot" hidden>
        <div class="shot-view"><img id="shotImg" alt=""></div>
        <div class="shot-bar">
          <button class="btn" id="shotPrev" type="button">Prev</button>
          <span class="shot-count" id="shotCount" aria-live="polite"></span>
          <button class="btn" id="shotNext" type="button">Next</button>
        </div>
      </div>
      <p class="desc" id="dDesc"></p>
      <a class="btn go" id="dGo" href="#" target="_blank" rel="noopener">Open project</a>
      <a class="btn go" id="dGo2" href="#" target="_blank" rel="noopener" hidden>Read the paper</a>
    </div>
  </div>
</div>
